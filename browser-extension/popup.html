<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Al-Ameen</title>
  <style>
    body {
      margin: 0;
      width: 320px;
      background: #f4f6f8;
      font-family: Arial, sans-serif;
      color: #344054;
    }

    main {
      padding: 18px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: 15px;
      color: #101828;
    }

    p.subtitle {
      margin: 0 0 16px;
      font-size: 12px;
      color: #667085;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin: 12px 0 4px;
      color: #344054;
    }

    select {
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #d0d5dd;
      font-size: 13px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 10px;
      border: 0;
      border-radius: 8px;
      background: #b42318;
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      background: #98a2b3;
      cursor: not-allowed;
    }

    #unavailable {
      font-size: 12px;
      color: #b42318;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Request File Upload Access</h1>
    <p class="subtitle">
      Request permission for files at or below a classification tier before you try to upload or
      drag-and-drop them. Public files never need a request.
    </p>

    <label for="actionKey">Action</label>
    <select id="actionKey">
      <option value="browser.upload">Upload (file picker / form)</option>
      <option value="browser.drag-drop">Drag and drop</option>
    </select>

    <label for="tier">Classification Tier</label>
    <select id="tier">
      <option value="Internal">Internal</option>
      <option value="Secret">Secret</option>
      <option value="Very_Secret">Very Secret</option>
    </select>

    <button id="continueButton">Continue to Portal</button>
    <div id="unavailable">
      The employee portal address is not configured on this device. Contact IT.
    </div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
